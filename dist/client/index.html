<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <script>if(matchMedia("(max-width:760px)").matches&&!new URLSearchParams(location.search).has("desktop"))location.replace("mobile.html");</script>
  <title>Trompetterie</title>
  <link rel="stylesheet" href="trompetterie-shell.css?v=81" />
  <link rel="stylesheet" href="home.css?v=81" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#f3efe5" />
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Trompetterie" />
  <meta name="mobile-web-app-capable" content="yes" />
</head>
<body>
  <button class="music-clef-handle" id="musicClefHandle" type="button" aria-controls="musicDrawer" aria-expanded="false" aria-label="Ouvrir le menu musical">
    <span class="menu-handle-label">Menu</span>
  </button>
  <div class="drawer-veil" id="drawerVeil" hidden></div>
  <aside class="music-drawer" id="musicDrawer" aria-hidden="true" aria-label="Menu musical Trompetterie">
    <header class="drawer-header">
      <div><span>TROMPETTERIE</span><strong>Que veux-tu jouer ?</strong></div>
      <button id="drawerClose" type="button" aria-label="Fermer le menu">×</button>
    </header>

    <div class="source-tabs" role="tablist" aria-label="Type de contenu">
      <button type="button" class="active" data-source-tab="scale" role="tab" aria-selected="true">Gammes</button>
      <button type="button" data-source-tab="music" role="tab" aria-selected="false">Musiques</button>
    </div>

    <section class="drawer-source active" data-source-panel="scale">
      <label>Note de départ
        <select id="drawerRoot">
          <option value="0">Do trompette</option><option value="1">Do♯ trompette</option><option value="2" selected>Ré trompette</option>
          <option value="3">Mi♭ trompette</option><option value="4">Mi trompette</option><option value="5">Fa trompette</option>
          <option value="6">Fa♯ trompette</option><option value="7">Sol trompette</option><option value="8">La♭ trompette</option>
          <option value="9">La trompette</option><option value="10">Si♭ trompette</option><option value="11">Si trompette</option>
        </select>
      </label>
      <label>Gamme
        <select id="drawerScale">
          <option value="blues" selected>Blues</option><option value="major">Majeure</option><option value="minor">Mineure naturelle</option>
          <option value="pentatonic">Pentatonique majeure</option><option value="minorPentatonic">Pentatonique mineure</option>
        </select>
      </label>
    </section>

    <section class="drawer-source" data-source-panel="music" hidden>
      <label>Morceau
        <select id="drawerMusic">
          <option value="demo">Premiers pas — démo</option>
          <option value="a-night-in-tunisia">A Night in Tunisia</option>
          <option value="all-blues">All Blues</option>
          <option value="b-y-t">B.Y.T.</option>
          <option value="billie-s-bounce">Billie's Bounce</option>
          <option value="cherokee">Cherokee</option>
          <option value="four-brothers">Four Brothers</option>
          <option value="it-don-t-mean-a-thing">It Don't Mean a Thing</option>
          <option value="mack-the-knife">Mack the Knife</option>
          <option value="misty">Misty</option>
          <option value="moanin">Moanin'</option>
          <option value="new-york-new-york">New York, New York</option>
          <option value="on-green-dolphin-street">On Green Dolphin Street</option>
          <option value="satin-doll">Satin Doll</option>
          <option value="soda-daoud">Soda — Daoud</option>
          <option value="st-thomas">St. Thomas</option>
          <option value="stolen-moments">Stolen Moments</option>
          <option value="take-the-a-train">Take the A Train</option>
        </select>
      </label>
      <button class="drawer-import" id="drawerImportMidi" type="button"><span>＋</span><strong>Importer un MIDI</strong><small>Notes exactes et accompagnement</small></button>
    </section>

    <section class="mode-picker">
      <span class="drawer-section-title">Mode d'apprentissage</span>
      <div class="mode-options">
        <label><input type="radio" name="drawerMode" value="hero" checked /><span><strong>Héros</strong><small>Réflexes</small></span></label>
        <label><input type="radio" name="drawerMode" value="instrument" /><span><strong>Instrument</strong><small>Trompette 3D</small></span></label>
        <label><input type="radio" name="drawerMode" value="partition" /><span><strong>Partition</strong><small>Lecture pure</small></span></label>
      </div>
    </section>

    <footer class="drawer-footer">
      <p id="drawerSummary">Ré trompette · Blues · Héros</p>
      <button id="drawerPlay" type="button"><span>▶</span> Jouer</button>
    </footer>
  </aside>

  <main class="home-stage">
    <span class="home-eyebrow">Trompetterie.lol</span>
    <h1 class="home-title">Trompetterie</h1>
    <p class="home-subtitle">Ouvre le menu, choisis ta gamme ou ton morceau, puis lance-toi.</p>
  </main>

  <script src="trompetterie-shell.js?v=81"></script>
  <script src="home.js?v=81"></script>
</body>
</html>

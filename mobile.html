<body class="mobile-home">

      <div class="m-panel active" data-panel="scale">

      </div>
      <div class="m-panel" data-panel="music" hidden>

    <section class="m-mode-section"><div class="m-section-title"><small>MODE D’APPRENTISSAGE</small><span id="mModeHint">Réflexes visuels</span></div><div class="m-mode-grid"><button class="active" data-mode="hero"><b>Héros</b><span>Réflexes</span></button><button data-mode="instrument"><b>Instrument</b><span>Trompette 3D</span></button><button data-mode="partition"><b>Partition</b><span>Lecture pure</span></button></div></section>
